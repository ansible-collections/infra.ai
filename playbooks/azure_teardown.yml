---
- name: Teardown Azure infrastructure
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Delete VM
      ansible.builtin.include_role:
        name: cloud.azure_ops.azure_virtual_machine_with_public_ip
      vars:
        azure_virtual_machine_with_public_ip_operation: delete
        azure_virtual_machine_with_public_ip_remove_on_absent: all_autocreated
        azure_virtual_machine_with_public_ip_resource_group: "{{ rhelai_azure_resource_group_name }}"
        azure_virtual_machine_with_public_ip_region: "{{ rhelai_azure_region }}"
        azure_virtual_machine_with_public_ip_vm:
          name: "{{ rhelai_azure_vm_name }}"
          admin_username: "{{ rhelai_azure_admin_username }}"
        # azure_virtual_machine_with_public_ip_delete_resource_group: false

