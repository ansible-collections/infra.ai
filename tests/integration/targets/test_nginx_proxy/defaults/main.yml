---
######################################## Instructlab variables
rhelai_aws_instance_type: t2.micro  # AWS instance type out of g6 family
rhelai_aws_rhelai_ami: ami-043baf7ad7d67ea00  # AMI for RHEL 9 on AWS

######################################## AWS variables
rhelai_aws_resource_name: "rhelai"  # Names your EC2 instance
rhelai_aws_aws_region: eu-central-1
rhelai_aws_vpc_cidr: "10.0.0.0/16"
rhelai_aws_subnet_cidr: "10.0.1.0/24"
rhelai_aws_eip: ""
rhelai_aws_key_name: ""
# rhelai_aws_key_material: ""

######################################## Nginx proxy settings
nginx_proxy_fqdn: example.tld
nginx_proxy_install_dir: /home/ec2-user
nginx_proxy_tls_organization_name: ACME Ltd.
