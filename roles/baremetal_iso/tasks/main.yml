---
- name: Validate input variables
  ansible.builtin.assert:
    that:
      - baremetal_iso_network_address is defined
      - baremetal_iso_network_netmask is defined
      - baremetal_iso_network_gateway is defined
  when: baremetal_iso_network_mode == "static"

- name: Generate RHAI kickstart file
  block:
    - name: Create temporary file
      ansible.builtin.tempfile:
        state: file
        prefix: rhelai-bootc-{{ baremetal_iso_unique_name }}-
        suffix: .ks
      register: __baremetal_iso_temp_ks

    - name: Generate temp kickstart
      ansible.builtin.template:
        src: rhelai-bootc.ks.j2
        dest: "{{ __baremetal_iso_temp_ks.path }}"
        mode: "0600"

- name: Set output variable baremetal_iso_image
  ansible.builtin.set_fact:
    baremetal_iso_image: "{{ baremetal_iso_source_image }}.{{ baremetal_iso_unique_name }}-ks.iso"

- name: Remaster ISO image
  ansible.builtin.command:
    cmd: mkksiso "{{ __baremetal_iso_temp_ks.path }}" "{{ baremetal_iso_source_image }}" "{{ baremetal_iso_image }}"
    creates: "{{ baremetal_iso_image }}"

- name: Remove kickstart file
  ansible.builtin.file:
    path: "{{ __baremetal_iso_temp_ks.path }}"
    state: absent
