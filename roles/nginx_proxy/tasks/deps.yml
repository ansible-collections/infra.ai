---
- name: Install pip
  become: true
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: Install cryptography package
  ansible.builtin.pip:
    name: cryptography

- name: Install Podman Compose using pip
  ansible.builtin.pip:
    name: podman-compose
    state: present
    executable: pip3
