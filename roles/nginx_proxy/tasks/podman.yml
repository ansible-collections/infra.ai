- name: Set sysctl for unprivileged ports
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '80'
    sysctl_set: true
    state: present
    reload: true

- name: Validate podman compose file
  ansible.builtin.command:
    cmd: "{{ nginx_proxy_install_dir }}/.local/bin/podman-compose -f {{ nginx_proxy_install_dir }}/podman-compose.yml config"
  register: podman_compose_config
  changed_when: false

- name: Run the podman compose file in detached mode
  ansible.builtin.command:
    cmd: "{{ nginx_proxy_install_dir }}/.local/bin/podman-compose -f {{ nginx_proxy_install_dir }}/podman-compose.yml up -d"
  register: podman_compose_up
  changed_when: podman_compose_up.rc != 0

- name: Debug the connection locally by curling the host
  ansible.builtin.uri:
    url: "https://{{ inventory_hostname }}"
    follow_redirects: none
    method: GET
    headers:
      Host: "{{ nginx_proxy_fqdn }}"
  register: _result
  until: _result.status == 200
  retries: 3
  delay: 5
