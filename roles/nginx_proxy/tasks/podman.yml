---
- name: Install Podman using dnf
  become: true
  ansible.builtin.dnf:
    name: podman
    state: present
    use_backend: dnf4

- name: Start and enable podman service
  ansible.builtin.systemd_service:
    name: podman.socket
    state: started
    scope: user
    enabled: true

- name: Create podman compose file
  ansible.builtin.template:
    src: podman-compose.yml.j2
    dest: "{{ nginx_proxy_install_dir }}/podman-compose.yml"
    mode: '0640'

- name: Create host nginx config file
  ansible.builtin.template:
    src: rhelai.conf.j2
    dest: "{{ nginx_proxy_install_dir }}/rhelai.conf"
    mode: '0640'

