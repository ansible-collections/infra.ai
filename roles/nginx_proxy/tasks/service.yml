---
- name: Create a local systemd directory
  ansible.builtin.file:
    path: "{{ nginx_proxy_install_dir }}/.config/systemd/user"
    state: directory
    mode: '0755'
  register: nginx_proxy_service_dir

- name: Create an nginx configuration directory
  ansible.builtin.file:
    path: "{{ nginx_proxy_install_dir }}/nginx/conf.d"
    state: directory
    mode: '0755'
  register: nginx_proxy_conf_dir

- name: Create an nginx ssl directory
  ansible.builtin.file:
    path: "{{ nginx_proxy_install_dir }}/nginx/ssl"
    state: directory
    mode: '0755'
  register: nginx_proxy_ssl_dir

- name: Create nginx service file
  ansible.builtin.template:
    src: nginx-proxy.service.j2
    dest: "{{ nginx_proxy_service_dir.path }}/nginx-proxy.service"
    mode: '0644'

- name: Create nginx host file
  ansible.builtin.template:
    src: nginx-host.conf.j2
    dest: "{{ nginx_proxy_conf_dir.path }}/{{ nginx_proxy_fqdn }}.conf"
    mode: '0644'

- name: Copy certificate
  ansible.builtin.copy:
    src: ./certs/certificate.pem
    dest: "{{ nginx_proxy_ssl_dir.path }}"
    mode: '0644'

- name: Copy certificate key
  ansible.builtin.copy:
    src: ./certs/certificate.key
    dest: "{{ nginx_proxy_ssl_dir.path }}"
    mode: '0644'

- name: Enable and start nginx proxy service
  ansible.builtin.systemd_service:
    name: nginx-proxy
    state: started
    enabled: true
    scope: user
