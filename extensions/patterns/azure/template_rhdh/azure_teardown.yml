apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: infra-azure-teardown
  title: RHEL AI Azure teardown
  description: This wizard will guide you on how to teardown RHEL AI on Azure
  namespace: default
  tags:
    - aap-operations
    - intermediate
    - rhel
spec:
  type: service
  parameters:
    - title: Prompts
      description: >-
        Teardown RHEL AI on Azure.
      required:
        - token
        - inventory
        - credentials
      properties:
        token:
          title: Token
          type: string
          description: Oauth2 token
          ui:field: AAPTokenField
          ui:widget: password
          ui:backstage:
            review:
              show: false
        inventory:
          title: Inventory
          description: Please enter the Azure inventory you want to use
          resource: inventories
          ui:field: AAPResourcePicker
        credentials:
          title: Credentials
          description: >-
            Select credentials for accessing the Azure.
          type: array
          ui:field: AAPResourcePicker
          resource: credentials
    - title: Survey
      description: >-
        Teardown RHEL AI on Azure.
      required: []
      properties:
        azureRegion:
          title: Azure region
          description: Azure region
          type: string
          default: eastus
        azureResourceGroupName:
          title: Azure resource group name
          description: Azure resource group name
          type: string
          default: myRHELAI
        azureVmName:
          title: Azure VM name
          description: Azure VM name
          type: string
          default: myVM
  steps:
    - id: launch-job
      name: Launch RHEL Infra AI / Teardown Azure
      action: rhaap:launch-job-template
      input:
        token: ${{ parameters.token }}
        values:
          templateID: null
          inventory: ${{ parameters.inventory  }}
          credentials: ${{ parameters.credentials }}
          extraVariables:
            rhelai_azure_region: ${{ parameters.azureRegion }}
            rhelai_azure_resource_group_name: ${{ parameters.azureResourceGroupName }}
            rhelai_azure_vm_name: ${{ parameters.azureVmName }}
  output:
    text:
      - title: Launch RHEL Infra AI / Teardown Azure template executed successfully
        content: |
          **Job ID:** ${{ steps['launch-job'].output.data.id }}
          **Job STATUS:** ${{ steps['launch-job'].output.data.status }}
    links:
      - title: View in RH AAP
        url: ${{ steps['launch-job'].output.data.url }}
