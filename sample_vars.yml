---
######################################## Instructlab variables
rhelai_ilab_registry_user: ""
rhelai_ilab_registry_password: ""
rhelai_ilab_api_token: mytoken

######################################## AWS variables
rhelai_aws_instance_type: g6.2xlarge  # AWS instance type out of g6 family
rhelai_aws_rhelai_ami: ami-123456789  # AMI for RHEL AI on AWS
rhelai_aws_resource_name: "myRHELAIInstance"  # Names your EC2 instance
rhelai_aws_aws_region: us-east-1
rhelai_aws_vpc_cidr: "10.0.0.0/16"
rhelai_aws_subnet_cidr: "10.0.1.0/24"
rhelai_aws_eip: ""
rhelai_aws_key_name: "rhelai-keyname"
rhelai_aws_key_material: "ssh-ed25519 ... your public key here ..."

######################################## GCP variables
rhelai_gcp_resource_name: rhelai-gcp
rhelai_gcp_region: europe-central2
rhelai_gcp_project: rhelai-gcp
rhelai_gcp_instance_type: e2-micro
rhelai_gcp_service_account: xxx-compute@developer.gserviceaccount.com
rhelai_gcp_service_account_file: key.json
rhelai_gcp_key_material: |
  user:ssh-ed25519 ... your public key here ... user@email
rhelai_gcp_eip: ""
rhelai_gcp_instance_disk_size_gb: 100
rhelai_gcp_image_path: projects/acme/global/images/rhel-ai
rhelai_gcp_ansible_user: cloud-user

######################################## Nginx proxy settings
nginx_proxy_fqdn: example.tld
nginx_proxy_install_dir: /home/ec2-user
nginx_proxy_tls_organization_name: ACME Ltd.

######################################## baremetal
rhelai_baremetal_root_password_plain:
rhelai_baremetal_ssh_key: "ssh-ed25519 AAAA... comment"
rhelai_baremetal_registry_username:
rhelai_baremetal_registry_password:
rhelai_baremetal_source_image: /path/to/rhel-ai-nvidia-1.4-1739107830-x86_64-boot.iso

######################################## Azure variables
rhelai_azure_region: eastus
rhelai_azure_tags:
  Environment: RHEL-AI
  Component: LLM-Serving
rhelai_azure_resource_group_name: my-rg0
rhelai_azure_admin_username: redhat
# rhelai_azure_admin_password: redhatp
rhelai_azure_ssh_keys:
  - path: /home/{{ rhelai_azure_admin_username }}/.ssh/authorized_keys
    key_data: "ssh-ed25519 AAAAC3... comment"
rhelai_azure_vm_name: my-vm0
# GPU count from sku and size need to match.
rhelai_azure_vm_size: Standard_NC4as_T4_v3  # Standard_B1ms
rhelai_azure_image_sku: rh-rhelai-nvidia-1gpu
rhelai_azure_vnet_address_prefixes_cidr: 10.0.0.0/16
rhelai_azure_subnet_address_prefixes_cidr: 10.0.1.0/24
rhelai_azure_managed_disk_type: Standard_LRS
